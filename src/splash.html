<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 400px;
      height: 300px;
      overflow: hidden;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      font-size: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .title {
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-bottom: 32px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .progress-container {
      position: relative;
      width: 240px;
      height: 4px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
      transition: width 0.3s ease;
      animation: loading 2s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        width: 0%;
        margin-left: 0%;
      }
      50% {
        width: 60%;
        margin-left: 20%;
      }
      100% {
        width: 0%;
        margin-left: 100%;
      }
    }

    .status {
      height: 16px;
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    </style>
  </head>
  <body>
    <div class="logo">🗄️</div>
    <div class="title">DBManager</div>
    <div class="subtitle">Database Management Tool</div>
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
    <div class="status" id="status">Starting up...</div>

    <script>
    "use strict";
    const { ipcRenderer } = require("electron");

    ipcRenderer.on("splash-status", (_event, message) => {
      document.getElementById("status").textContent = message;
    });
    </script>
  </body>
</html>
